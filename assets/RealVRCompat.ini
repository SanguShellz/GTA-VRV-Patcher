; ============================================================
;  RealVRCompat - Configuracion de parches (para diagnostico)
; ============================================================
;  1 = parche ACTIVADO   0 = parche DESACTIVADO
;
;  Edita estos valores y REINICIA el juego para probar.
;  Objetivo: encontrar cual parche rompe la camara/control
;  al salir de un vehiculo.
; ------------------------------------------------------------
;  FirstPersonJump  -> 0x5477->0x56B3 salta el bloque de camara 1a persona
;  VehicleCamNop    -> 0x55AD NOP del bucle de camara de vehiculo
;  CamPoolWriteNop  -> 0x28F1 congela la escritura de RealVR a +0x38098
;  ForceFallback    -> 0x28D0 fuerza el fallback de metadata de camara
;  CamPoolResolve   -> escribe la camara encontrada a +0x38098
;  CamMetaOldOffset -> 0x28B4 fuerza resolver metadata por offset -0x28
;  RestoreCamMetadata -> restaura ultimo +0x38098 no nulo si se limpia
;  RestoreRVRState -> restaura flags pequenos de g_RVRData al cambiar vehiculo/pie
;  ActiveEnginePatches -> llama los 6 trampolines originales del engine
;  EnginePatchDelaySec -> espera antes de aplicar los 6 hooks del engine
; ============================================================

[patches]
; --- PRUEBA 13: script-camera reset (replica el respawn del hospital) ---
;     Al salir del vehiculo crea una scripted cam en la misma posicion/rotacion
;     de la gameplay cam, la activa por ScriptCamResetFrames frames y luego la
;     destruye. Cuando GTA desactiva la scripted cam y re-activa la gameplay cam,
;     RealVR re-inicializa su camara de primera persona (IS_GAMEPLAY_CAM_RENDERING
;     va de false a true), restaurando el seguimiento HMD igual que al respawnear.
FirstPersonJump=1
VehicleCamNop=1
CamPoolWriteNop=0
ForceFallback=1
CamPoolResolve=1
CamMetaOldOffset=1
RestoreCamMetadata=1
RestoreRVRState=1
ActiveEnginePatches=0
EnginePatchDelaySec=70


FirstPersonRearmFrames=120
FirstPersonGuardFrames=600
FirstPersonGuardPulseFrames=0
FirstPersonGuardInterval=90

FirstPersonFlagHold=0
FirstPersonControlFixFrames=0
FirstPersonResetRearmFrames=0
FirstPersonUnclampFrames=120
FirstPersonSoftReset=1
FirstPersonSoftResetFrames=8
KeepVehicleFirstPerson=0
RespawnGraceFrames=300
ScriptCamReset=0
# ScriptCamResetFrames=90
