; =======================================
;  RealVRCompat - Patch Configuration
; =======================================
;  1 = PATCH ENABLED   0 = PATCH DISABLED
;
;  Edit these values and RESTART the game to test.
; =======================================

[patches]

; Enables/disables the first-person camera patch.
FirstPersonJump=1

; Enables/disables the vehicle camera patch.
VehicleCamNop=1

; Prevents RealVR from updating the camera pool.
CamPoolWriteNop=0

; Forces fallback camera metadata resolution.
ForceFallback=1

; Stores the resolved camera in the camera pool.
CamPoolResolve=1

; Uses the legacy camera metadata offset.
CamMetaOldOffset=1

; Restores camera metadata if it becomes invalid.
RestoreCamMetadata=1

; Restores RealVR state when entering or exiting vehicles.
RestoreRVRState=1

; Applies RealVR's engine-level patches.
ActiveEnginePatches=0

; Delay (in seconds) before applying engine patches.
EnginePatchDelaySec=70

; Frames before first-person handling is rearmed.
FirstPersonRearmFrames=120

; Number of frames the first-person guard remains active.
FirstPersonGuardFrames=600

; Duration of each guard pulse in frames.
FirstPersonGuardPulseFrames=0

; Frames between guard checks.
FirstPersonGuardInterval=90

; Keeps the first-person state flag active.
FirstPersonFlagHold=0

; Duration of the first-person control fix in frames.
FirstPersonControlFixFrames=0

; Delay before rearming after a reset.
FirstPersonResetRearmFrames=0

; Frames before yaw/pitch limits are removed after transitions.
FirstPersonUnclampFrames=120

; Performs a soft reset of the first-person camera.
FirstPersonSoftReset=1

; Duration of the soft reset in frames.
FirstPersonSoftResetFrames=8

; Keeps first-person view when entering a vehicle.
KeepVehicleFirstPerson=0

; Grace period after respawning.
RespawnGraceFrames=300

; Resets the scripted camera.
ScriptCamReset=0

; Duration of the scripted camera reset.
ScriptCamResetFrames=2

; Resets the player model when exiting a vehicle.
VehicleExitModelReset=1

; Requires player control before performing a model reset.
ModelResetRequireControl=1

; Maximum delay before performing a model reset.
ModelResetDeferMaxFrames=300

; Restores weapons and ammo after a model reset.
ModelResetPreserveWeapons=1

; Restores the wanted level after a model reset.
ModelResetPreserveWantedLevel=1

; Recenters the HMD when exiting a vehicle.
VehicleExitRecenterFix=0

; Corrects player heading after cutscenes.
CutsceneHeadingFix=1

; Recenters the HMD after cutscenes.
CutsceneRecenterFix=1

; Performs a soft first-person reset after cutscenes.
CutsceneSoftReset=1

; Resets the scripted camera when a cutscene ends.
CutsceneScriptCamReset=0

; Frames to wait before restoring control after a cutscene.
CutsceneEndSettleFrames=2

; Corrects heading after temporary loss of player control.
ControlLossHeadingFix=1

; Frames of lost control before the heading correction activates.
ControlLossThresholdFrames=45